name: Auto Approve Dependency PRs
on:
  pull_request:
    types: [labeled, opened, synchronize]

jobs:
  auto_approve:
    runs-on: ubuntu-latest
    # REPLACE 'skip-review' with your exact tag or label name
    if: contains(github.event.pull_request.labels.*.name, 'dependencies')
    
    permissions:
      pull-requests: write # Required to submit a PR review approval

    steps:
      - name: Approve Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.pullRequests.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'APPROVE',
              body: '🤖 Automated approval: This PR is a dependency update, bypassing automated AI code review rules.'
            })
