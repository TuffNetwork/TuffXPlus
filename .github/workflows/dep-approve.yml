name: Auto Approve Dependency PRs
on:
  pull_request_target:
    types: [labeled, opened, synchronize]

jobs:
  auto_approve:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'dependencies')
    
    permissions:
      pull-requests: write # Required to submit a PR review approval

    steps:
      - name: Generate Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TUFF_BUILDER_ID }}
          private-key: ${{ secrets.TUFF_BUILDER_PRIVATE_KEY }}

      - name: Approve Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'APPROVE',
              body: '🤖 Automated approval: This PR is a dependency update, bypassing automated AI code review rules.'
            })
